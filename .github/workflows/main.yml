name: Gokboru Browser APK Derle

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP dosyalarini ac
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          shopt -s nullglob
          ZIP_FILES=( *.zip )

          for ZIP in "${ZIP_FILES[@]}"; do
            echo "ZIP aciliyor: $ZIP"
            unzip -oq "$ZIP" -d extracted
          done

      - name: Android projesini bul
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS="$(find . \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "HATA: settings.gradle veya settings.gradle.kts bulunamadi."
            echo "Depodaki dosyalar:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "Android projesi: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          if [ ! -f "$PROJECT_DIR/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "HATA: Proje kokunde build.gradle dosyasi bulunamadi."
            exit 1
          fi

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK derle
        run: |
          gradle -p "${{ steps.project.outputs.project_dir }}" \
            assembleDebug --no-daemon --stacktrace

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: Gokboru-Browser-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
